<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logo-grad" x1="85%" y1="85%" x2="15%" y2="15%">
          <stop offset="0%" stop-color="#3b82f6" />
          
          <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.40" />
        </filter>
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
        </filter>
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
        </filter>
    <clipPath id="shape-clip"><rect x="10" y="10" width="492" height="492" rx="120" ry="120" /></clipPath>
  </defs>
  <rect x="10" y="10" width="492" height="492" rx="120" ry="120" fill="url(#logo-grad)"  filter="url(#shadow)" />
  
  <g transform="translate(256, 162) rotate(0) translate(-256, -162)" filter="url(#icon-shadow)">
          <text x="256" y="177" font-size="302px" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', sans-serif">
            💻
          </text>
        </g>
  <text x="256" y="428.25" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="90px" letter-spacing="1px" fill="#60dc1e" text-anchor="middle" filter="url(#text-shadow)"><tspan x="256" dy="0px">SvgFav </tspan></text>
</svg>