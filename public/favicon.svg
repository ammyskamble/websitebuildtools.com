<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Vibrant Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#BA13E0" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="accentSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FF385C" />
    </linearGradient>

    <linearGradient id="techGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.04" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="mainGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7C3AED" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF3366" flood-opacity="0.25" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND: Modern App Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- CAD / VECTOR GRID MATRIX (Subtle Background) -->
  <g opacity="0.7">
    <circle cx="256" cy="216" r="168" fill="url(#techGrid)" />
    <circle cx="256" cy="216" r="168" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,6" opacity="0.4" />
    <circle cx="256" cy="216" r="108" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,5" opacity="0.3" />
    <line x1="256" y1="44" x2="256" y2="388" stroke="#475569" stroke-width="1" stroke-dasharray="4,6" opacity="0.3" />
    <line x1="84" y1="216" x2="428" y2="216" stroke="#475569" stroke-width="1" stroke-dasharray="4,6" opacity="0.3" />
  </g>

  <!-- EMBLEM: Pen-Tool / Heart / Favorite Node -->
  <g filter="url(#mainGlow)">
    <!-- Primary Vector Heart Path -->
    <path d="M 256,336 
             C 192,274 104,212 104,142 
             C 104,86 148,52 204,52 
             C 228,52 248,64 256,80 
             C 264,64 284,52 308,52 
             C 364,52 408,86 408,142 
             C 408,212 320,274 256,336 Z" 
          fill="url(#primaryGrad)" />

    <!-- Isometric Reflection / Specular Cut -->
    <path d="M 256,80 L 256,336 C 288,305 352,246 384,196 C 352,176 304,144 256,80 Z" 
          fill="#FFFFFF" opacity="0.16" />

    <!-- Bézier Tangent Handles & Guidelines -->
    <line x1="152" y1="126" x2="360" y2="126" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5,5" opacity="0.85" />

    <!-- Left Control Node (Round) -->
    <circle cx="152" cy="126" r="8" fill="#FFFFFF" stroke="#BA13E0" stroke-width="3.5" />

    <!-- Right Control Node (Round) -->
    <circle cx="360" cy="126" r="8" fill="#FFFFFF" stroke="#BA13E0" stroke-width="3.5" />

    <!-- Pen-Tool Diamond Tip (Center Calibration Point) -->
    <path d="M 256,120 L 292,156 L 256,192 L 220,156 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="256" cy="156" r="5" fill="#4F46E5" />

    <!-- Central Anchor Point (Selected Node) -->
    <rect x="246" y="196" width="20" height="20" rx="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3.5" />

    <!-- Favorite Sparkle Star (Top Right) -->
    <path d="M 390,52 Q 390,78 416,78 Q 390,78 390,104 Q 390,78 364,78 Q 390,78 390,52 Z" 
          fill="url(#accentSpark)" filter="url(#sparkleGlow)" />
  </g>

  <!-- LOGO TEXT BRANDING: svgfav -->
  <g transform="translate(0, 428)">
    <text x="256" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="52" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">svg</tspan><tspan font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#accentSpark)">fav</tspan>
    </text>
    <text x="256" y="24" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#94A3B8">FAVORITE &amp; EXPORT</text>
  </g>
</svg>