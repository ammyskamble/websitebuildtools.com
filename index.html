        <h2>Frequently Asked Questions & Educational Guide</h2>
        <article>
          <h3>what is an svg file / what is svg / what is svg file (was ist eine svg datei / was ist svg / ist svg eine vektordatei)</h3>
          <p>SVG (Scalable Vector Graphics) is an open XML-based 2D vector file format standard defined by the W3C. Unlike raster pixel grids (JPEG, PNG), SVG stores graphic shapes using mathematical points, curves, and coordinates, ensuring infinite sharpness at any resolution without pixellation.</p>
        </article>

        <article>
          <h3>svg o que é / o que é svg / arquivo svg o que é / o que é um arquivo svg</h3>
          <p>O SVG (Scalable Vector Graphics) é um padrão aberto de imagem vetorial em formato XML padronizado pelo W3C. Ele armazena nós, linhas e curvas de Bézier matemáticas em vez de pixels, permitindo ampliação infinita com alta nitidez para logotipos, ícones de interface e máquinas de corte.</p>
        </article>

        <article>
          <h3>what is a favicon / how to add favicon in html (Was ist ein Favicon? / favicon was ist das)</h3>
          <p>A favicon is the small branded logo displayed in browser tabs, bookmark bars, and search results. To add a favicon in HTML: place favicon.ico, favicon.svg, and apple-touch-icon.png in your site root and add &lt;link rel="icon" href="/favicon.ico" sizes="any"&gt; and &lt;link rel="icon" href="/favicon.svg" type="image/svg+xml"&gt; inside the &lt;head&gt; tag.</p>
        </article>
